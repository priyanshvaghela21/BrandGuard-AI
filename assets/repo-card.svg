    <rect x="180" y="-3" width="138" height="20" rx="10" fill="#111C31" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <text x="190" y="11" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🏆 CODEX 48 Finalist</text>

    <!-- License -->
    <text x="335" y="10" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">MIT License</text>
