    </text>
    <rect x="180" y="2" width="56" height="18" rx="9" fill="#0C2032" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="1"/>
    <text x="194" y="15" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Public</text>
  </g>

  <!-- Description -->
  <text x="24" y="78" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
