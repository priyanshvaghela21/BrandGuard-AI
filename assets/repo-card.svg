  </text>

  <!-- Meta Stats Row -->
  <g transform="translate(24, 130)">
    <!-- Languages -->
    <circle cx="6" cy="6" r="5" fill="#F1E05A" />
    <text x="16" y="10" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">JavaScript</text>

    <circle cx="106" cy="6" r="5" fill="#3572A5" />
    <text x="116" y="10" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Python</text>

