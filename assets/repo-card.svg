<svg width="600" height="170" viewBox="0 0 600 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="600" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080E1A" />
      <stop offset="1" stop-color="#0E1726" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="600" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.2" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="300" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="170" rx="12" fill="url(#cardBg)" />
  <rect x="1" y="1" width="598" height="168" rx="11" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Repo Icon -->
  <g transform="translate(24, 24)">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="#38BDF8">
      <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5v-9zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8V1.5z"/>
    </svg>
    <text x="30" y="16" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
